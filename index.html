<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Phase 6 — installable/offline app shell. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SokSan Network (សុខសាន្ត) — Cambodia's serene travel social network. Hidden gems, aesthetic cafes, eco-resorts and KHQR bookings." />
    <title>SokSan Network · សុខសាន្ត</title>

    <!--
      Security hardening (added 2026-09-29):

      1. TRACKING REMOVED. This file previously contained three scripts
         injected by the design/export tooling, none of which belong to
         SokSan. All three are deleted. There is now NO analytics,
         NO third-party script, and NO external beacon in this app.

      2. CSP notes (Phase 0 hardening):
         - The CSP meta tag below is the DEVELOPMENT policy for Vite HMR.
         - At `vite build` time, vite.config.ts (productionCspPlugin) swaps
           it for the hardened PRODUCTION CSP (script-src 'self' only,
           tile/R2/media domains allow-listed). frame-ancestors is set
           via public/_headers + deploy/nginx.conf.example.
         - X-Frame-Options, X-Content-Type-Options and HSTS are enforced
           at the web server/CDN (see docs/DEPLOYMENT.md).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://picsum.photos https://*.picsum.photos https://commondatastorage.googleapis.com https://*.r2.cloudflarestorage.com; media-src 'self' blob: https://commondatastorage.googleapis.com https://*.r2.cloudflarestorage.com; connect-src 'self' ws: wss: https://tiles.openfreemap.org https://*.openfreemap.org https://*.r2.cloudflarestorage.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(self), payment=()" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
