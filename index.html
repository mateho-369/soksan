<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="description" content="SokSan Network (សុខសាន្ត) — Cambodia's serene travel social network. Hidden gems, aesthetic cafes, eco-resorts and KHQR bookings." />
    <title>SokSan Network · សុខសាន្ត</title>

    <!--
      Security hardening (added 2026-09-29):

      1. TRACKING REMOVED. This file previously contained three scripts
         injected by the design/export tooling, none of which belong to
         SokSan:
           - a full-session recorder (rrweb) that also captured
             keystrokes, clicks, scroll and cursor paths;
           - a page-view beacon that POSTed to the design tool's API with
             a persistent localStorage viewer id;
           - an injected element-picker editor listening on
             postMessage('*').
         All three are deleted (2026-09-29). There is now NO analytics,
         NO third-party script, and NO external beacon in this app.

      2. CSP notes:
         - script-src keeps 'unsafe-inline' ONLY because the Vite dev
           server injects an inline React-Refresh preamble. The production
           bundle contains no inline scripts, so behind your web
           server/CDN you can tighten it to 'self' (ideally with nonces).
         - connect-src allows ws:/wss: for the dev server's HMR socket;
           production can drop those.
         - frame-ancestors, X-Frame-Options and X-Content-Type-Options
           cannot be set from meta tags — enforce them at the web
           server/CDN (see README → Security posture).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://picsum.photos https://*.picsum.photos; media-src 'self' blob: https://commondatastorage.googleapis.com; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <meta http-equiv="Permissions-Policy" content="camera=(), geolocation=(), microphone=(), payment=()" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
